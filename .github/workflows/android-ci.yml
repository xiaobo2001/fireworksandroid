name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # ubuntu-latest runner 预装 Android SDK（ANDROID_HOME 已设置），
      # 仅需接受许可协议（含 preview 条款），不再依赖 setup-android action
      # （其内部 sdkmanager 在接受 preview 许可时 exit 1，为已知问题）
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Grant gradlew execute permission
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew :app:testReleaseUnitTest --console=plain
      - name: Assemble release AAR
        run: ./gradlew :app:assembleRelease --console=plain
